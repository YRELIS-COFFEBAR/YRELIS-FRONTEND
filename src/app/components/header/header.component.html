<header class="header">
  <div class="header-inner">
    <a routerLink="/menu" class="brand">
      <span class="brand-logo-wrap">
        <img
          src="assets/images/logo/logo.png"
          alt="Yrelis CoffeeBar"
          class="brand-logo"
          (error)="onLogoError($event)"
        />
      </span>
      <span class="brand-text">
        <span class="brand-title">Yrelis CoffeeBar</span>
        <span class="brand-tagline">Café · Comida · Coctelería</span>
      </span>
    </a>

    <a routerLink="/carrito" class="cart-btn" aria-label="Ver pedido">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1.6"></circle>
        <circle cx="20" cy="21" r="1.6"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span class="cart-label">Mi pedido</span>
      @if (order.count() > 0) {
        <span class="cart-badge" [class.badge-pop]="order.count() > 0">{{ order.count() }}</span>
      }
    </a>
  </div>
</header>
